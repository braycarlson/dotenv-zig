indent-width = 4
line-length = 100
src = ["conformance"]
target-version = "py312"

exclude = [
    ".git",
    ".ruff_cache",
    ".tigerstyle_cache",
    ".zig-cache",
    "__pycache__",
    "zig-out",
]

[format]
indent-style = "space"
quote-style = "single"

[lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "I001",
    "ISC001",
    "SIM102",
    "UP035",
]

[lint.flake8-quotes]
inline-quotes = "single"

[lint.pylint]
max-args = 18

[lint.per-file-ignores]
"conformance/generate.py" = [
    "S311",
]
